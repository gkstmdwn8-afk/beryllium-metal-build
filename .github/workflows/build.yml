# Builds NativeAdrenoMetal.bundle (AdrenoMetal + Turnip) for the beryllium A630 kernel driver on a GitHub macOS runner.
# Every input is a public repository at a pinned commit; nothing device-specific or proprietary is in this repository.
#   unixnu-core      513f6a20  build scripts, Mesa patches, kits/AdrenoPM4 (submodule)
#   AdrenoMetal      c31037dc  the plugin (NativeAdreno ABI v1, matches our kernel)
#   unixnu-adreno6xx 86e0f1b   NativeAdrenoABI.h of the beryllium kernel (byte-identical to package/gpu/core)
#   Mesa             85fda3b3  + unixnu-core patches/mesa (applied in the recorded order)
#   metal2vulkan     624bab39  (patched by build-adreno-metal-bridge.py itself)
# Our own changes on top: patches/adrenometal (the plugin) and patches/mesa (Turnip, appended to the recorded Mesa patch list).
name: build-metal-plugin
on:
  workflow_dispatch:
    inputs:
      mesa_patches:
        description: "beryllium Turnip patches (patches/mesa): on or off"
        type: choice
        options: ["on", "off"]
        default: "on"
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      CORE_COMMIT: 513f6a208026b0386635d666b4e9f6c61f364f56
      METAL_COMMIT: c31037dc6e01593ba93a8973a488a88b6188b349
      ABI_COMMIT: 86e0f1b
      M2V_COMMIT: 624bab3918de5b978e1101517abca2b4fa426565
      # A push has no inputs: the patches are on.
      BERYLLIUM_MESA_PATCHES: ${{ inputs.mesa_patches || 'on' }}
      ROOT: ${{ github.workspace }}/core
    defaults:
      run:
        # Every step's output also goes to one log; on failure its tail is published as annotations (readable without login).
        shell: bash --noprofile --norc -c "set -o pipefail; bash -e {0} 2>&1 | tee -a \"$RUNNER_TEMP/all.log\""
    steps:
      # This repository's own files (patches/adrenometal); runs first, before core/ is cloned into the workspace.
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install glslang shaderc bison llvm ninja
          glslc --version | head -1
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Sources
        run: |
          git clone --filter=blob:none https://github.com/RigoLigoRLC/unixnu-core.git "$ROOT"
          git -C "$ROOT" checkout --quiet "$CORE_COMMIT"
          git -C "$ROOT" submodule update --init --filter=blob:none drivers/AdrenoMetal kits/AdrenoPM4
          test "$(git -C "$ROOT/drivers/AdrenoMetal" rev-parse HEAD)" = "$METAL_COMMIT"
          # beryllium patches on the plugin (patches/adrenometal, applied in name order): diagnostics and opt-in switches, see each patch.
          for p in "$GITHUB_WORKSPACE"/patches/adrenometal/*.patch; do git -C "$ROOT/drivers/AdrenoMetal" apply "$p"; echo "applied $(basename "$p")"; done
          git clone --filter=blob:none https://github.com/RigoLigoRLC/unixnu-adreno6xx.git abi
          git -C abi checkout --quiet "$ABI_COMMIT"
          test -f abi/NativeAdrenoABI.h
          mkdir -p "$ROOT/.cache/gpu-reference"
          git clone --filter=blob:none --branch development https://github.com/steelbrain/metal2vulkan.git "$ROOT/.cache/gpu-reference/metal2vulkan"
          git -C "$ROOT/.cache/gpu-reference/metal2vulkan" checkout --quiet "$M2V_COMMIT"
          # GpuScanoutClient.h includes ../NativeMobileDisplay/NativeGOPWire.h, which lives in the device repository, not in
          # the core. The public UniXNU-dipper copy is byte-identical to the beryllium one (sha256 f318da02...).
          mkdir -p "$ROOT/drivers/NativeMobileDisplay"
          curl -fsSL -o "$ROOT/drivers/NativeMobileDisplay/NativeGOPWire.h" \
            https://raw.githubusercontent.com/hanyaa380/UniXNU-dipper/a7f7250a5efc72b571804e2b429d931c89a71e3c/drivers/NativeMobileDisplay/NativeGOPWire.h
          echo "f318da02e91844eb6552584bee1e50081dff633d6238c0c97e83edd91dd7f779  $ROOT/drivers/NativeMobileDisplay/NativeGOPWire.h" | shasum -a 256 -c

      - name: Mesa (pinned, patched)
        run: |
          MESA=$(python3 -c "import json;print(json.load(open('$ROOT/scripts/data/adreno-compiler-inputs.json'))['mesa']['commit'])")
          git init --quiet "$ROOT/.cache/mesa-work"
          cd "$ROOT/.cache/mesa-work"
          git remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git fetch --quiet --depth 1 origin "$MESA" || { git remote set-url origin https://chromium.googlesource.com/external/gitlab.freedesktop.org/mesa/mesa; git fetch --quiet --depth 1 origin "$MESA"; }
          git checkout --quiet FETCH_HEAD
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          root = os.environ['ROOT']
          # Some recorded patches (Mesa turnip-darwin-perfetto-capture, metal2vulkan bridge 0029) add files without the
          # "new file mode" line, which git apply (and the recorded-patch validator, which reverse-applies the same files)
          # refuses. Add the line; the content is unchanged.
          for d in ('patches/mesa', 'drivers/AdrenoMetal/bridge/patches'):
              for p in pathlib.Path(root, d).glob('*.patch'):
                  s = p.read_text()
                  n = re.sub(r'^(diff --git a/(\S+) b/\2\n)(--- /dev/null\n)', r'\1new file mode 100644\n\3', s, flags=re.M)
                  if n != s:
                      p.write_text(n)
                      print('added new file mode lines to', p.name)
          # beryllium's Turnip patches (this repository's patches/mesa, in name order) join the end of the recorded list, so
          # build-turnip-darwin.py's patch check and its source identity cover them as they cover the recorded ones.
          inputs = root + '/scripts/data/adreno-compiler-inputs.json'
          pins = json.load(open(inputs))
          if os.environ.get('BERYLLIUM_MESA_PATCHES', 'on') != 'off':
              for p in sorted(pathlib.Path(os.environ['GITHUB_WORKSPACE'], 'patches/mesa').glob('*.patch')):
                  pathlib.Path(root, 'patches/mesa', p.name).write_bytes(p.read_bytes())
                  pins['patches'].append('patches/mesa/' + p.name)
              with open(inputs, 'w') as f:
                  json.dump(pins, f, indent=2)
          for p in pins['patches']:
              subprocess.run(['git', 'apply', root + '/' + p], check=True)
              print('applied', p)
          PY

      - name: Python and bison for Mesa
        run: |
          python3 -m venv "$ROOT/.cache/mesa-venv"
          "$ROOT/.cache/mesa-venv/bin/pip" install --quiet meson==1.9.1 Mako==1.3.10 MarkupSafe==3.0.4 packaging==25.0 PyYAML==6.0.3 ply==3.11
          mkdir -p "$ROOT/.cache/mesa-tools/bin"
          ln -sf "$(brew --prefix bison)/bin/bison" "$ROOT/.cache/mesa-tools/bin/bison"
          ln -sf "$(brew --prefix bison)/bin/yacc" "$ROOT/.cache/mesa-tools/bin/yacc"
          bison --version | head -1 || "$ROOT/.cache/mesa-tools/bin/bison" --version | head -1

      - name: Turnip (iOS)
        run: |
          cd "$ROOT"
          python3 scripts/build-turnip-darwin.py --target ios --abi-directory "$GITHUB_WORKSPACE/abi"

      - name: Plugin
        run: |
          cd "$ROOT"
          python3 scripts/build-adreno-metal-plugin.py --gpu-abi-dir "$GITHUB_WORKSPACE/abi" --turnip-replay off

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R "$ROOT/build/adreno-metal-plugin" out/ 2>/dev/null || true
          find "$ROOT/build" "$ROOT/.cache" -maxdepth 3 -name "*.log" -exec cp {} out/ \; 2>/dev/null || true
          ls -laR out | head -80

      - name: Failure log as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'all.log')
          lines = open(path, errors='replace').read().splitlines()[-160:] if os.path.exists(path) else ['no log']
          text = '\n'.join(l[-300:] for l in lines)
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][-8:]
          for n, c in enumerate(chunks, 1):
              c = c.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=log tail {n}/{len(chunks)}::{c}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-adreno-metal
          path: out
          retention-days: 30
